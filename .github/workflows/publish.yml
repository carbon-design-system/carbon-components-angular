name: Deploy

on:
  # Runs on pushes targeting release branches
  push:
    branches: ["master", "next", "v3", "v9", "v5-11"]

  # Allows us to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read # for checkout

jobs:
  # Single deploy job since we're just deploying
  publish:
    environment:
      name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on pull requests
      id-token: write # to enable use of OIDC for npm trusted publishing & provenance
    steps:
      # Checkout to branch
      - name: Checkout
        uses: actions/checkout@v4

      # Angular 14 toolchain builds on Node 18
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install packages
        run: npm i

      # Build CCA package
      - name: Build package
        run: npm run build

      # npm trusted publishing (OIDC) needs npm 11.5+ and semantic-release needs Node 22.14+
      - name: Setup Node for release
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      # @semantic-release/npm runs `npm publish` preferring node_modules/.bin, where
      # package-lock.json installs npm 8 (no OIDC support). dist/ is already built,
      # so dropping node_modules to publish with Node 24's npm instead.
      - name: Remove project node_modules
        run: rm -rf node_modules

      # Run Semantic release to publish package to NPM
      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx -y semantic-release@25.0.3

      # Push storybook build to gh-pages branch if pushed to `master` branch
      - name: Serve storybook
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ secrets.CARBON_BOT_DCO }}
        run: ./scripts/deploy.sh
        shell: bash
