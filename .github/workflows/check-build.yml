name: Check build

on:
  push:
    branches: [ master, next ]
  pull_request:
    branches: [ master, next ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Node 24 matches the publish workflow (semantic-release v25 requires Node 22.14+).
    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Run build
      run: |
        npm i
        npm run ng:build --if-present
        cd dist
        npm pack
    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/carbon-components-angular-0.0.0.tgz
        if-no-files-found: error

  app-build:
    needs: build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        angular-version: [20, 21]
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
    - run: |
        npm i
        npm i ./../../carbon-components-angular-0.0.0.tgz
        npm run build
        npm run build -- --configuration production
      working-directory: integration/ng${{ matrix.angular-version }}
